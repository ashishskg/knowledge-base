<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskDash (Production-Style Demo)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
      <span aria-hidden="true">☰</span>
    </button>
    <div class="brand">
      <div class="logo" aria-hidden="true">TD</div>
      <div>
        <div class="brand-title">TaskDash</div>
        <div class="brand-sub">Responsive production-style UI (no build tools)</div>
      </div>
    </div>

    <div class="top-actions">
      <div class="search">
        <input id="globalSearch" type="search" placeholder="Search tasks…" aria-label="Search tasks" />
      </div>
      <button class="btn" id="newTaskBtn" type="button">New Task</button>
    </div>
  </header>

  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <nav class="nav">
        <a class="nav-link" href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a class="nav-link" href="#/projects" data-route="projects">Projects</a>
        <a class="nav-link" href="#/tasks" data-route="tasks">Tasks</a>
        <a class="nav-link" href="#/settings" data-route="settings">Settings</a>
      </nav>

      <div class="sidebar-foot">
        <div class="small muted">Data persists in <code>localStorage</code>.</div>
        <button class="btn ghost" id="resetDataBtn" type="button">Reset demo data</button>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div class="page" id="app"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <h2 class="modal-title" id="modalTitle">New task</h2>
        <button class="icon-btn" id="modalClose" type="button" aria-label="Close dialog">×</button>
      </header>

      <form class="form" id="taskForm">
        <label class="field">
          <span class="label">Title</span>
          <input id="taskTitle" name="title" required minlength="3" placeholder="e.g., Fix header layout" />
          <span class="help">Min 3 characters.</span>
        </label>

        <div class="row">
          <label class="field">
            <span class="label">Project</span>
            <select id="taskProject" name="projectId"></select>
          </label>

          <label class="field">
            <span class="label">Priority</span>
            <select id="taskPriority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span class="label">Description</span>
          <textarea id="taskDesc" name="description" rows="3" placeholder="What needs to be done?"></textarea>
        </label>

        <div class="row">
          <label class="field">
            <span class="label">Due date</span>
            <input id="taskDue" name="due" type="date" />
          </label>

          <label class="field">
            <span class="label">Status</span>
            <select id="taskStatus" name="status">
              <option value="todo" selected>To do</option>
              <option value="doing">Doing</option>
              <option value="done">Done</option>
            </select>
          </label>
        </div>

        <footer class="modal-foot">
          <button class="btn ghost" type="button" id="cancelTask">Cancel</button>
          <button class="btn primary" type="submit">Save</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
